# Usar junto con docker-compose.yml desde la raíz del proyecto.
services:
  nexpapi:
    build:
      context: .
      dockerfile: nexpapi/Dockerfile
    env_file: ./nexpapi/.env
    restart: unless-stopped
    networks: [automatizacion]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).close()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
